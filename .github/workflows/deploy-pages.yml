# Publishes the offline PWA to GitHub Pages. MANUAL ONLY: it never runs on its own.
# One-time setup by the repository owner: Settings → Pages → Build and deployment → Source: "GitHub Actions".
# Then: Actions → "deploy-pwa-to-pages" → Run workflow. The site will be public at
# https://<owner>.github.io/<repo>/ — only do this if you are happy for the app to be publicly reachable.
name: deploy-pwa-to-pages
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vitest run
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
