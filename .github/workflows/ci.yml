# Runs the full free verification suite. Triggered on pull requests and manually only.
name: verify
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run verify
        env:
          PLAYWRIGHT_BROWSERS_PATH: ''
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verify-evidence
          path: |
            docs/evidence/verify-latest.md
            tests/a001/results/
            test-results/
